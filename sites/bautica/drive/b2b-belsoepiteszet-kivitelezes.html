 class="section soft"><div class="container"><div class="text-center mb-5"><div class="eyebrow">A MEGOLDÁSI MODELL</div><h2 class="mt-2">Három elem, amely végigviszi a döntést.</h2></div><div class="row g-4">${cards(p.solutions)}</div></div></section><section class="section" id="folyamat"><div class="container"><div class="row align-items-end mb-5"><div class="col-lg-8"><div class="eyebrow">ÁTTEKINTHETŐ FOLYAMAT</div><h2 class="mt-2">Hat lépés a projektbriefből a dokumentált átadásig.</h2></div></div><div class="steps">${steps}</div></div></section><section class="section soft"><div class="container"><div class="row g-4"><div class="col-lg-6"><div class="cardx"><div class="eyebrow">MIT KAP?</div><h2 class="mt-2">Nem csak kivitelezést. Döntési biztonságot.</h2><ul><li>Jóváhagyott műszaki alap</li><li>Követhető költség- és ütemezési logika</li><li>Név szerinti felelősök</li><li>Dokumentált változáskezelés</li></ul></div></div><div class="col-lg-6"><div class="cardx"><div class="eyebrow">MIT KÉRÜNK?</div><h2 class="mt-2">A gyors előminősítéshez szükséges adatok.</h2><ul><li>Helyszín és projektfunkció</li><li>Alapterület és rendelkezésre álló tervek</li><li>Kívánt műszaki tartalom</li><li>Célhatáridő és döntési folyamat</li></ul></div></div></div></div></section><section class="section"><div class="container"><div class="cta" id="ajanlat"><div class="row align-items-center g-4"><div class="col-lg-8"><div class="eyebrow text-white-50">KÖVETKEZŐ DÖNTÉS</div><h2 class="mt-2">Nézzük meg, reális-e a projekt a kívánt keretben.</h2><p class="mb-0">Küldje el a helyszínt, a terveket és a fő üzleti célt.</p></div><div class="col-lg-4 text-lg-end"><a class="btnx ghost" href="/kapcsolat/">${p.cta}</a></div></div></div></div></section><section class="section soft"><div class="container"><div class="row g-5"><div class="col-lg-5"><div class="eyebrow">GYAKORI KÉRDÉSEK</div><h2 class="mt-2">Rövid válaszok a következő döntéshez.</h2></div><div class="col-lg-7">${faq}</div></div></div></
