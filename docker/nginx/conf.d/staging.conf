server {
  listen 8080 default_server;
  server_name
    localhost
    imperial.localhost
    danish-fabrik.localhost
    bautica.localhost
    prefab.localhost
    casa-moderna.localhost
    family-homes.localhost
    everyday-homes.localhost
    property-360.localhost
    budapesti-magasepito-vallalat.localhost
    baufreund.localhost
    red-property.localhost
    timberhaus.localhost;

  root /srv/sites/$site_root;
  index index.html;
  autoindex off;
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location /assets/ {
    alias /srv/sites/_shared/assets/;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Backward-compatible technical prefix. New user-facing links do not need it.
  location /core/ {
    proxy_pass http://platform-core:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /core;
    proxy_redirect http://localhost/ /;
    proxy_redirect http://localhost:8080/ /;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }

  # Same-origin, allow-listed visual previews remain static and isolated.
  location ~ ^/site-preview/(?<preview_site>imperial|danish-fabrik|bautica|prefab|casa-moderna|family-homes|everyday-homes|property-360|budapesti-magasepito-vallalat|baufreund|red-property|timberhaus)(?<preview_path>/.*)?$ {
    root /srv/sites/$preview_site;
    rewrite ^/site-preview/[^/]+/?(.*)$ /$1 break;
    try_files $uri $uri/index.html =404;
  }

  location ~ (^|/)\. {
    deny all;
  }

  # Preserve the public UAT link that was already shared with colleagues.
  location = /workspace {
    return 302 /;
  }

  location = /workspace/ {
    return 302 /;
  }

  # Imperial Intelligence is the default public application. Keeping the
  # canonical URI makes server-rendered navigation, forms and CSRF origins work.
  location / {
    proxy_pass http://platform-core:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect http://localhost/ /;
    proxy_redirect http://localhost:8080/ /;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }
}
