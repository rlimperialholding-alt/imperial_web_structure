x-growth-production-environment: &growth-production-environment
  ENVIRONMENT: "production"
  GROWTH_OPS_ENABLED: "true"
  CANONICAL_GROWTH_ENABLED: "true"
  CANONICAL_ROUTE_SCANNING_ENABLED: "true"
  CANONICAL_PROCESSING_ENABLED: "true"
  CANONICAL_GROWTH_DAILY_AT: "05:30"
  GROWTH_OPS_TIMEZONE: "Europe/Budapest"
  GROWTH_OPS_OUTREACH_SEND_START_LOCAL: "00:00"
  GROWTH_OPS_OUTREACH_SEND_END_LOCAL: "00:00"
  GROWTH_OPS_OUTREACH_BUDAPEST_DAY_MAX: "2000"
  GROWTH_OPS_OUTREACH_SEND_CONCURRENCY: "1"
  GROWTH_OPS_OUTREACH_REPUTATION_BOOTSTRAP_MESSAGES_PER_WINDOW: "100"
  GROWTH_OPS_OUTREACH_REPUTATION_MAX_GROWTH_FACTOR: "1.25"
  GROWTH_OPS_OUTREACH_REPUTATION_JITTER_FRACTION: "0.20"
  GROWTH_OPS_SCHEDULED_GMAIL_ENABLED: "true"
  GROWTH_OPS_SCHEDULED_GMAIL_CLIENTS_FILE: "/run/secrets/growth/scheduled-gmail-clients.json"
  GROWTH_OPS_SCHEDULED_GMAIL_ESCROW_SIGNING_PRIVATE_KEY_FILE: "/run/secrets/growth/scheduled-gmail-escrow-server-private.pem"
  GROWTH_OPS_SCHEDULED_GMAIL_ESCROW_SIGNING_PUBLIC_KEY_FILE: "/run/secrets/growth/scheduled-gmail-escrow-server-public.pem"
  GROWTH_OPS_SCHEDULED_GMAIL_ESCROW_SIGNING_KEY_ID: "imperial-scheduled-gmail-escrow-v1"

services:
  platform-core:
    environment: *growth-production-environment
  growth-ops-worker:
    environment: *growth-production-environment
