# Managed by Imperial AI ADAS v2.3.3. Do not edit this generated file directly.
name: Imperial ADAS Semgrep
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.172.0
      - name: Run targeted SAST (platform-core code, CSRF exception, bounded timeout)
        # Task65 evidence contract: minden részscan JSON ``errors`` listája üres
        # és exit kódja 0 kell legyen. Két technikai hibát kezel ez a lépés:
        # 1) Timeout: a pinelt semgrep==1.172.0 per-rule-per-file timeoutja
        #    alapból 5 s; az app/main.py és app/models.py nagy moduljain a
        #    közösségi taint-szabályok (boto3/flask) ezt túllépik (Task64 run
        #    33420589320: 6 Timeout hiba). A ``--timeout 30`` korlátos,
        #    indokolt emelés: egy 30 s-t is túllépő szabály továbbra is
        #    Timeout hibát ad, amit az összesített fail-closed kapu elutasít
        #    (a hidden opció a pinelt 1.172.0-ban rögzített, a pin miatt a
        #    jövőbeli verzióváltás nem némíthatja el).
        # 2) Jinja-sablonok: a html-parser a ``{% %}``/``{{ }}``
        #    konstrukciókat részleges parse-ként jelenti; a sablonok külön
        #    path-szűk shardba kerültek (lásd a következő lépést), itt a
        #    platform-core kód/tests/Dockerfile szabályhalmaza fut.
        # Path-szűk rule-kivétel (Task61 threat model:
        # services/platform-core/docs/csrf-threat-model.md): a
        # python.django.security.django-no-csrf-token kizárólag a
        # platform-core FastAPI/Jinja2 alkalmazásra van kivéve (nincs
        # Django-függőség; minden POST form/endpoint CSRF-védelmét a
        # SessionWriteOriginMiddleware + synchronizer token réteg
        # biztosítja, a services/platform-core/tests/
        # test_csrf_control_matrix.py végpont- és tesztszinten bizonyítja).
        # Minden más path (pl. Django template-ek) továbbra is vizsgált:
        # az utolsó lépés azokon a rule kizárása nélkül fut.
        # Orchestration: if: always() + saját exit kód rögzítése és tovább-
        # adása (a lépés a scan kilépőkódjával ér véget, nem zöldül);
        # az összesített végső kapu az Enforce lépésben fail-closed.
        if: always()
        run: >-
          status=0 ; semgrep scan --config auto --error --json --no-rewrite-rule-ids
          --timeout 30
          --exclude services/platform-core/app/templates
          --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token
          --output semgrep-platform-core.json
          services/platform-core
          || status=$? ; printf '%s\n' "$status" > semgrep-platform-core.exit ; exit "$status"
      - name: Run targeted SAST (platform-core Jinja templates, parser-compatible shard)
        # Task65 sharding: a 87 Jinja/HTML partial parse-t (Task64 run
        # 33420589320) parser-kompatibilis, path-szűk felosztás szünteti meg:
        # ez a shard kizárólag a services/platform-core/app/templates
        # könyvtárat vizsgálja, és kizárja azt a két html-szabályt, amely a
        # Jinja-szintaxist nem tudja parse-olni
        # (html.security.audit.missing-integrity.missing-integrity,
        # html.security.plaintext-http-link.plaintext-http-link). A kizárás
        # minimális path-scope-ú (csak ez a shard, csak ez a könyvtár; a
        # sites/** és minden más HTML path a rest scanben a teljes
        # szabályhalmazzal fut), és érdemi kompenzáló ellenőrzés jár hozzá:
        # a scripts/check_scan_exception_compensations.py determinisztikusan
        # ellenőrzi a kizárt szabályok biztonsági tulajdonságait
        # (remote script/link integrity, plaintext-http hivatkozás) ezen az
        # exact path-körön. A multilang szabályok változatlanul futnak a
        # sablonokon; a django-no-csrf-token kivétel (Task61) itt is
        # érvényes, mert a sablonok a platform-core alkalmazás részei.
        # Széles körű exclude, errors-törlés vagy fail-open downgrade nincs.
        if: always()
        run: >-
          status=0 ; semgrep scan --config auto --error --json --no-rewrite-rule-ids
          --exclude-rule html.security.audit.missing-integrity.missing-integrity
          --exclude-rule html.security.plaintext-http-link.plaintext-http-link
          --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token
          --output semgrep-platform-core-templates.json
          services/platform-core/app/templates
          || status=$? ; printf '%s\n' "$status" > semgrep-platform-core-templates.exit ; exit "$status"
      - name: Run targeted SAST (npm projects with enforced package-age gate)
        # Path-szűk rule-kivétel (threat model:
        # services/imperial-sales-crm/docs/package-age-threat-model.md): a
        # package_managers.npm.npm-missing-minimum-release-age kizárólag a
        # két npm projektre (imperial-sales-crm, itep-core) van kivéve,
        # mert mindkettőben futó, tesztelt 7 napos package-age kapu van
        # (scripts/check-package-age.mjs, Quality CI; a kapu a dev/devOptional
        # függőségekre is kiterjed, includeDev=true), az audit/signature/
        # lockfile kontrollok változatlanok. Minden más path vizsgált.
        if: always()
        run: >-
          status=0 ; semgrep scan --config auto --error --json --no-rewrite-rule-ids
          --output semgrep-npm.json
          --exclude-rule package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age
          services/imperial-sales-crm services/itep-core
          || status=$? ; printf '%s\n' "$status" > semgrep-npm.exit ; exit "$status"
      - name: Run targeted SAST (all remaining paths, full rule set)
        # Minden más path a teljes szabályhalmazzal, kivétel nélkül;
        # a fenti path-ok a saját lépéseikben minden más szabályra
        # vizsgáltak, így a repo lefedettsége teljes marad.
        if: always()
        run: >-
          status=0 ; semgrep scan --config auto --error --json --no-rewrite-rule-ids
          --output semgrep-rest.json
          --exclude services/platform-core
          --exclude services/imperial-sales-crm
          --exclude services/itep-core
          .
          || status=$? ; printf '%s\n' "$status" > semgrep-rest.exit ; exit "$status"
      - name: Verify rule-exception compensating checks
        # Task65 kompenzáló ellenőrzés a templates-shard html-rule kivételei
        # mögé: determinisztikus, fail-closed tulajdonság-ellenőrzés az exact
        # path-körön (remote script/link integrity és plaintext-http
        # hivatkozás); bármely sértés FAIL-lal zárja a lépést.
        if: always()
        run: python scripts/check_scan_exception_compensations.py
      - name: Merge Semgrep evidence
        if: always()
        run: python scripts/merge_semgrep_evidence.py
      - name: Enforce Semgrep verdict
        # Összesített fail-closed kapu (scripts/enforce_semgrep_verdict.py):
        # bármely részscan JSON hiányos vagy nem parse-olható, bármely
        # rögzített scan exit kód nem 0, bármely rész CRITICAL/HIGH/
        # ERROR találatot tartalmaz, vagy bármely rész ``errors`` mezője
        # hiányzik, nem lista típusú vagy nem üres → FAIL. A lépésenkénti
        # exit kódokat és artifactokat a fenti lépések őrzik meg; az
        # if: always() csak a teljes lefutást biztosítja, a job-összegzést
        # nem zöldíti.
        if: always()
        run: python scripts/enforce_semgrep_verdict.py
      - name: Upload Semgrep evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: imperial-adas-semgrep
          path: |
            semgrep.json
            semgrep-platform-core.json
            semgrep-platform-core-templates.json
            semgrep-npm.json
            semgrep-rest.json
            semgrep-platform-core.exit
            semgrep-platform-core-templates.exit
            semgrep-npm.exit
            semgrep-rest.exit
          if-no-files-found: warn
