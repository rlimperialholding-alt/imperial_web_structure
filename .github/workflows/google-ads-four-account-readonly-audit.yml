name: Google Ads four-account read-only audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only Google Ads audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: imperial-test
    env:
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_ADS_SERVICE_ACCOUNT_JSON }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: "8668141303"
      GOOGLE_ADS_API_VERSION: v25
      GOOGLE_CLOUD_PROJECT_NUMBER: "1091317438049"
    steps:
      - name: Query four accounts through searchStream only
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const CUSTOMER_IDS = [
            '3676357956',
            '2519304345',
            '1804370841',
            '5238545096'
          ];

          const QUERIES = [
            {
              dataset: 'conversion_actions',
              query: `SELECT
                conversion_action.id,
                conversion_action.name,
                conversion_action.status,
                conversion_action.type,
                conversion_action.category,
                conversion_action.primary_for_goal,
                conversion_action.counting_type,
                conversion_action.click_through_lookback_window_days,
                conversion_action.view_through_lookback_window_days,
                conversion_action.value_settings.default_value,
                conversion_action.value_settings.always_use_default_value,
                conversion_action.owner_customer
              FROM conversion_action
              ORDER BY conversion_action.id`
            },
            {
              dataset: 'customer_conversion_goals',
              query: `SELECT
                customer_conversion_goal.category,
                customer_conversion_goal.origin,
                customer_conversion_goal.biddable
              FROM customer_conversion_goal
              ORDER BY customer_conversion_goal.category, customer_conversion_goal.origin`
            },
            {
              dataset: 'campaign_conversion_goals',
              query: `SELECT
                campaign.id,
                campaign.name,
                campaign.status,
                campaign_conversion_goal.category,
                campaign_conversion_goal.origin,
                campaign_conversion_goal.biddable
              FROM campaign_conversion_goal
              ORDER BY campaign.id, campaign_conversion_goal.category, campaign_conversion_goal.origin`
            },
            {
              dataset: 'campaigns',
              query: `SELECT
                campaign.id,
                campaign.name,
                campaign.status,
                campaign.advertising_channel_type,
                campaign.serving_status,
                campaign.url_expansion_opt_out
              FROM campaign
              ORDER BY campaign.id`
            },
            {
              dataset: 'negative_shared_sets',
              query: `SELECT
                shared_set.id,
                shared_set.name,
                shared_set.type,
                shared_set.status,
                shared_set.member_count,
                shared_set.reference_count
              FROM shared_set
              WHERE shared_set.type = NEGATIVE_KEYWORDS
              ORDER BY shared_set.id`
            },
            {
              dataset: 'negative_shared_criteria',
              query: `SELECT
                shared_set.id,
                shared_set.name,
                shared_criterion.criterion_id,
                shared_criterion.keyword.text,
                shared_criterion.keyword.match_type
              FROM shared_criterion
              WHERE shared_set.type = NEGATIVE_KEYWORDS
              ORDER BY shared_set.id, shared_criterion.criterion_id`
            },
            {
              dataset: 'campaign_shared_sets',
              query: `SELECT
                campaign.id,
                campaign.name,
                campaign.status,
                campaign.advertising_channel_type,
                campaign_shared_set.shared_set,
                campaign_shared_set.status
              FROM campaign_shared_set
              ORDER BY campaign.id, campaign_shared_set.shared_set`
            },
            {
              dataset: 'pmax_url_expansion',
              query: `SELECT
                campaign.id,
                campaign.name,
                campaign.status,
                campaign.url_expansion_opt_out
              FROM campaign
              WHERE campaign.advertising_channel_type = PERFORMANCE_MAX
              ORDER BY campaign.id`
            },
            {
              dataset: 'pmax_webpage_exclusions',
              query: `SELECT
                campaign.id,
                campaign.name,
                campaign.status,
                campaign_criterion.criterion_id,
                campaign_criterion.type,
                campaign_criterion.negative,
                campaign_criterion.webpage.criterion_name,
                campaign_criterion.webpage.conditions
              FROM campaign_criterion
              WHERE campaign.advertising_channel_type = PERFORMANCE_MAX
                AND campaign_criterion.type = WEBPAGE
              ORDER BY campaign.id, campaign_criterion.criterion_id`
            },
            {
              dataset: 'pmax_asset_group_urls',
              query: `SELECT
                campaign.id,
                campaign.name,
                asset_group.id,
                asset_group.name,
                asset_group.status,
                asset_group.final_urls,
                asset_group.mobile_urls
              FROM asset_group
              WHERE campaign.advertising_channel_type = PERFORMANCE_MAX
              ORDER BY campaign.id, asset_group.id`
            }
          ];

          function required(name) {
            const value = process.env[name];
            if (!value) throw new Error(`${name} is not configured`);
            return value;
          }

          function parseServiceAccount(raw) {
            try {
              return JSON.parse(raw);
            } catch {
              return JSON.parse(Buffer.from(raw, 'base64').toString('utf8'));
            }
          }

          function base64url(input) {
            return Buffer.from(input)
              .toString('base64')
              .replace(/=/g, '')
              .replace(/\+/g, '-')
              .replace(/\//g, '_');
          }

          async function getAccessToken(credentials, scope) {
            const now = Math.floor(Date.now() / 1000);
            const header = base64url(JSON.stringify({alg: 'RS256', typ: 'JWT'}));
            const claim = base64url(JSON.stringify({
              iss: credentials.client_email,
              scope,
              aud: credentials.token_uri || 'https://oauth2.googleapis.com/token',
              iat: now,
              exp: now + 3600
            }));
            const unsigned = `${header}.${claim}`;
            const signature = crypto.sign(
              'RSA-SHA256',
              Buffer.from(unsigned),
              credentials.private_key
            );
            const assertion = `${unsigned}.${base64url(signature)}`;
            const body = new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion
            });
            const response = await fetch(
              credentials.token_uri || 'https://oauth2.googleapis.com/token',
              {
                method: 'POST',
                headers: {'content-type': 'application/x-www-form-urlencoded'},
                body
              }
            );
            const payload = await response.json();
            if (!response.ok || !payload.access_token) {
              throw new Error(`OAuth token exchange failed (${response.status}): ${payload.error || 'unknown_error'}`);
            }
            return payload.access_token;
          }

          function serviceUsageError(response, payload) {
            const error = payload && payload.error ? payload.error : payload;
            return new Error(
              `Service Usage request failed (${response.status}): ` +
              `${error && error.status ? error.status : 'unknown_status'} - ` +
              `${error && error.message ? error.message : 'unknown_error'}`
            );
          }

          async function enableGoogleAdsApi(credentials) {
            const projectNumber = required('GOOGLE_CLOUD_PROJECT_NUMBER');
            const serviceName = 'googleads.googleapis.com';
            const resource = `projects/${projectNumber}/services/${serviceName}`;
            const baseUrl = `https://serviceusage.googleapis.com/v1/${resource}`;
            const accessToken = await getAccessToken(
              credentials,
              'https://www.googleapis.com/auth/cloud-platform'
            );
            const headers = {authorization: `Bearer ${accessToken}`};

            let response = await fetch(baseUrl, {headers});
            let payload = await response.json();
            if (!response.ok) throw serviceUsageError(response, payload);
            const beforeState = payload.state || null;
            if (beforeState === 'ENABLED') {
              return {beforeState, changed: false, afterState: beforeState};
            }

            response = await fetch(`${baseUrl}:enable`, {
              method: 'POST',
              headers: {...headers, 'content-type': 'application/json'},
              body: '{}'
            });
            payload = await response.json();
            if (!response.ok) throw serviceUsageError(response, payload);

            const operationName = payload.name || null;
            if (operationName) {
              for (let attempt = 0; attempt < 30; attempt += 1) {
                const operationResponse = await fetch(
                  `https://serviceusage.googleapis.com/v1/${operationName}`,
                  {headers}
                );
                const operation = await operationResponse.json();
                if (!operationResponse.ok) {
                  throw serviceUsageError(operationResponse, operation);
                }
                if (operation.done) {
                  if (operation.error) {
                    throw new Error(
                      `Google Ads API enable operation failed: ${operation.error.message || 'unknown_error'}`
                    );
                  }
                  break;
                }
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }

            response = await fetch(baseUrl, {headers});
            payload = await response.json();
            if (!response.ok) throw serviceUsageError(response, payload);
            if (payload.state !== 'ENABLED') {
              throw new Error(`Google Ads API remains ${payload.state || 'UNKNOWN'} after enable request`);
            }
            return {
              beforeState,
              changed: true,
              operationName,
              afterState: payload.state
            };
          }

          function sanitizedError(response, payload) {
            const source = Array.isArray(payload) ? payload[0] : payload;
            const error = source && source.error ? source.error : source;
            return {
              httpStatus: response.status,
              code: error && error.code ? error.code : null,
              status: error && error.status ? error.status : null,
              message: error && error.message ? error.message : `HTTP ${response.status}`,
              requestId: response.headers.get('request-id') || response.headers.get('google-ads-request-id')
            };
          }

          async function queryAccount(accessToken, developerToken, customerId, spec) {
            const version = required('GOOGLE_ADS_API_VERSION');
            const response = await fetch(
              `https://googleads.googleapis.com/${version}/customers/${customerId}/googleAds:searchStream`,
              {
                method: 'POST',
                headers: {
                  authorization: `Bearer ${accessToken}`,
                  'content-type': 'application/json',
                  'developer-token': developerToken,
                  'login-customer-id': required('GOOGLE_ADS_LOGIN_CUSTOMER_ID')
                },
                body: JSON.stringify({query: spec.query})
              }
            );
            const payload = await response.json();
            if (!response.ok) {
              return {dataset: spec.dataset, ok: false, rows: [], error: sanitizedError(response, payload)};
            }
            const batches = Array.isArray(payload) ? payload : [payload];
            const rows = batches.flatMap(batch => batch.results || []);
            return {
              dataset: spec.dataset,
              ok: true,
              rows,
              fieldMask: batches.map(batch => batch.fieldMask).filter(Boolean),
              requestId: response.headers.get('request-id') || response.headers.get('google-ads-request-id')
            };
          }

          async function main() {
            const developerToken = required('GOOGLE_ADS_DEVELOPER_TOKEN');
            const credentials = parseServiceAccount(required('GOOGLE_ADS_SERVICE_ACCOUNT_JSON'));
            if (!credentials.client_email || !credentials.private_key) {
              throw new Error('Service account JSON is missing required fields');
            }
            const apiEnablement = await enableGoogleAdsApi(credentials);
            if (apiEnablement.changed) {
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            const accessToken = await getAccessToken(
              credentials,
              'https://www.googleapis.com/auth/adwords'
            );
            const audit = {
              generatedAt: new Date().toISOString(),
              mode: 'READ_ONLY_SEARCH_STREAM',
              apiVersion: required('GOOGLE_ADS_API_VERSION'),
              apiEnablement,
              managerCustomerId: required('GOOGLE_ADS_LOGIN_CUSTOMER_ID'),
              customerIds: CUSTOMER_IDS,
              accounts: []
            };

            for (const customerId of CUSTOMER_IDS) {
              const datasets = [];
              for (const spec of QUERIES) {
                datasets.push(await queryAccount(accessToken, developerToken, customerId, spec));
              }
              audit.accounts.push({customerId, datasets});
            }

            fs.writeFileSync(
              'google-ads-four-account-readonly-audit.json',
              JSON.stringify(audit, null, 2),
              {encoding: 'utf8', mode: 0o600}
            );

            const summary = audit.accounts.map(account => ({
              customerId: account.customerId,
              successfulDatasets: account.datasets.filter(dataset => dataset.ok).length,
              failedDatasets: account.datasets.filter(dataset => !dataset.ok).length,
              rowCounts: Object.fromEntries(account.datasets.map(dataset => [dataset.dataset, dataset.rows.length]))
            }));
            console.log(JSON.stringify({ok: true, mode: audit.mode, summary}));
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                '## Google Ads read-only audit\n\n`searchStream` only; no mutate endpoint is present.\n\n' +
                '```json\n' + JSON.stringify(summary, null, 2) + '\n```\n'
              );
            }
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Upload redacted audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-ads-four-account-readonly-audit
          path: google-ads-four-account-readonly-audit.json
          if-no-files-found: warn
          retention-days: 7
