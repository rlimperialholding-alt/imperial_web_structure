name: Staging CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: staging-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: imperial-ci-${{ github.run_id }}
      HTTP_PORT: "8080"
      NGINX_IMAGE: nginx:stable-alpine

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: sh scripts/validate-structure.sh

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start staging stack
        run: docker compose up --detach --wait --wait-timeout 60

      - name: Smoke test portal and sites
        shell: bash
        run: |
          set -euo pipefail

          portal_html="$(curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/)"

          grep --quiet 'id="brand-select"' <<<"$portal_html"
          grep --quiet 'id="review-panel"' <<<"$portal_html"
          grep --quiet 'data-device="desktop"' <<<"$portal_html"
          grep --quiet 'data-device="tablet"' <<<"$portal_html"
          grep --quiet 'data-device="mobile"' <<<"$portal_html"

          brands_json="$(curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/data/brands.json)"
          python3 -c 'import json,sys; data=json.load(sys.stdin); assert len(data["brands"]) == 12' <<<"$brands_json"

          sites=(
            imperial
            danish-fabrik
            bautica
            prefab
            casa-moderna
            family-homes
            everyday-homes
            property-360
            budapesti-magasepito-vallalat
            baufreund
            red-property
            timberhaus
          )

          for site in "${sites[@]}"; do
            site_html="$(curl --fail --silent --show-error \
              --header "Host: ${site}.localhost" \
              http://127.0.0.1:8080/)"
            grep --quiet 'name="robots" content="noindex,nofollow"' <<<"$site_html"
          done

          imperial_html="$(curl --fail --silent --show-error \
            --header "Host: imperial.localhost" \
            http://127.0.0.1:8080/)"
          for section_id in hero trust portfolio capabilities projects sustainability news contact; do
            grep --quiet "id=\"${section_id}\"" <<<"$imperial_html"
          done

          curl --fail --silent --show-error \
            --header "Host: localhost" \
            'http://127.0.0.1:8080/site-preview/imperial/?review=1' \
            | grep --quiet 'id="hero"'

          curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/assets/data/imperial-home.json \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["meta"]["containsCustomerData"] is False'

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/healthz \
            | grep --quiet "^ok$"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop staging stack
        if: always()
        run: docker compose down --volumes --remove-orphans
