name: Staging CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: staging-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: imperial-ci-${{ github.run_id }}
      HTTP_PORT: "8080"
      NGINX_IMAGE: nginx:stable-alpine

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate ephemeral platform database secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secrets
          openssl rand -hex 32 > secrets/platform_db_password.txt
          chmod 0400 secrets/platform_db_password.txt
          sudo chown 10001:10001 secrets/platform_db_password.txt

      - name: Validate repository structure
        run: sh scripts/validate-structure.sh

      - name: Set up Node.js for rendered QA
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser QA runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Everyday Homes rendered and asset gates
        shell: bash
        env:
          EVERYDAY_PREVIEW_ROOT: sites/everyday-homes
        run: |
          set -euo pipefail
          EVERYDAY_NODE=node python3 sites/everyday-homes/qa/run_render_gates.py
          node sites/everyday-homes/qa/validate_public_release.cjs
          python3 sites/everyday-homes/qa/validate_http.py --serve-local 18089

      - name: Enforce Everyday Homes content and release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 sites/everyday-homes/qa/build_completion_registry.py
          git diff --exit-code -- sites/everyday-homes/data/completion-registry.json
          python3 sites/everyday-homes/qa/validate_site.py
          python3 sites/everyday-homes/qa/validate_uniqueness.py
          python3 sites/everyday-homes/qa/validate_claim_evidence.py
          python3 sites/everyday-homes/qa/validate_release.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start staging stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Smoke test portal and sites
        shell: bash
        run: |
          set -euo pipefail

          portal_html="$(curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/)"

          grep --quiet 'id="brand-select"' <<<"$portal_html"
          grep --quiet 'id="page-select"' <<<"$portal_html"
          grep --quiet 'id="review-panel"' <<<"$portal_html"
          grep --quiet 'data-device="desktop"' <<<"$portal_html"
          grep --quiet 'data-device="tablet"' <<<"$portal_html"
          grep --quiet 'data-device="mobile"' <<<"$portal_html"

          brands_json="$(curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/data/brands.json)"
          python3 -c 'import json,sys; data=json.load(sys.stdin); assert len(data["brands"]) == 12' <<<"$brands_json"

          artifacts_json="$(curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/data/artifacts.json)"
          python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["meta"]["containsCustomerData"] is False; assert sum(len(x["pages"]) for x in data["brands"].values()) == 50' <<<"$artifacts_json"

          sites=(
            imperial
            danish-fabrik
            bautica
            prefab
            casa-moderna
            family-homes
            everyday-homes
            property-360
            budapesti-magasepito-vallalat
            baufreund
            red-property
            timberhaus
          )

          for site in "${sites[@]}"; do
            site_html="$(curl --fail --silent --show-error \
              --header "Host: ${site}.localhost" \
              http://127.0.0.1:8080/)"
            grep --quiet 'name="robots" content="noindex,nofollow"' <<<"$site_html"
          done

          imperial_html="$(curl --fail --silent --show-error \
            --header "Host: imperial.localhost" \
            http://127.0.0.1:8080/)"
          for section_id in hero trust portfolio capabilities projects sustainability news contact; do
            grep --quiet "id=\"${section_id}\"" <<<"$imperial_html"
          done

          preview_html="$(curl --fail --silent --show-error \
            --header "Host: localhost" \
            'http://127.0.0.1:8080/site-preview/imperial/?review=1')"
          grep --quiet 'id="hero"' <<<"$preview_html"

          drive_previews=(
            "site-preview/imperial/drive/venture/venture-studio.html?review=1"
            "site-preview/bautica/drive/b2b-belsoepiteszet-kivitelezes.html?review=1"
            "site-preview/prefab/drive/knowledge/osszes-tudasoldal.html?review=1"
            "site-preview/budapesti-magasepito-vallalat/drive/index.html?review=1"
          )

          for preview in "${drive_previews[@]}"; do
            drive_preview_html="$(curl --fail --silent --show-error \
              --header "Host: localhost" \
              "http://127.0.0.1:8080/${preview}")"
            grep --quiet '/assets/review-bridge.js' <<<"$drive_preview_html"
          done

          imperial_data_json="$(curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/assets/data/imperial-home.json)"
          python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["meta"]["containsCustomerData"] is False' <<<"$imperial_data_json"

          health_response="$(curl --fail --silent --show-error \
            http://127.0.0.1:8080/healthz)"
          grep --quiet "^ok$" <<<"$health_response"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop staging stack
        if: always()
        run: docker compose down --volumes --remove-orphans
