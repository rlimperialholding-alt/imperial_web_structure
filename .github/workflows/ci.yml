name: Staging CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: staging-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: imperial-ci-${{ github.run_id }}
      HTTP_PORT: "8080"
      NGINX_IMAGE: nginx:stable-alpine

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: sh scripts/validate-structure.sh

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start staging stack
        run: docker compose up --detach --wait --wait-timeout 60

      - name: Smoke test portal and sites
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/ >/dev/null

          sites=(
            imperial
            danish-fabrik
            bautica
            prefab
            casa-moderna
            family-homes
            everyday-homes
            property-360
            budapesti-magasepito-vallalat
            baufreund
            red-property
            timberhaus
          )

          for site in "${sites[@]}"; do
            curl --fail --silent --show-error \
              --header "Host: ${site}.localhost" \
              http://127.0.0.1:8080/ \
              | grep --quiet "Staging környezet"
          done

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/healthz \
            | grep --quiet "^ok$"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop staging stack
        if: always()
        run: docker compose down --volumes --remove-orphans
