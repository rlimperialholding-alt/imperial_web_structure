name: Staging CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: staging-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: imperial-ci-${{ github.run_id }}
      HTTP_PORT: "8080"
      NGINX_IMAGE: nginx:stable-alpine

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate ephemeral platform database secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secrets
          openssl rand -hex 32 > secrets/platform_db_password.txt
          chmod 0400 secrets/platform_db_password.txt
          sudo chown 10001:10001 secrets/platform_db_password.txt

      - name: Validate repository structure
        run: sh scripts/validate-structure.sh

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Ensure the shared integration network exists
        shell: bash
        run: |
          set -euo pipefail
          network_name="${INTEGRATED_NETWORK_NAME:-imperial-intelligence-test_default}"
          docker network inspect "$network_name" >/dev/null 2>&1 || docker network create "$network_name"

      - name: Start staging stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Smoke test portal and sites
        shell: bash
        run: |
          set -euo pipefail

          # A jelenlegi architektúra füsttesztje: a 9fc0751 óta az nginx a
          # platform-core FastAPI alkalmazásra proxyz (a korábbi statikus SPA
          # már nem az alapértelmezett felület), a brand-oldalak a
          # /site-preview/ útvonalon, az adatfájlok repo-szintű validálása a
          # validate-structure.sh lépésben fut.

          # 1) Az alkalmazás nyilvános felülete: / és /login HTML-oldal az
          #    alkalmazás base assetjével.
          for path in "/" "/login"; do
            page="$(curl --fail --silent --show-error --location \
              --header "Host: localhost" \
              "http://127.0.0.1:8080${path}")"
            grep --quiet '/static/style.css' <<<"$page"
          done

          # 2) A portal asset-réteg (a kliens routeMap-mel).
          portal_css="$(curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/assets/platform.css)"
          grep --quiet '.platform-shell' <<<"$portal_css"
          portal_js="$(curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/assets/platform.js)"
          grep --quiet 'history.pushState' <<<"$portal_js"

          # 3) Mind a 12 brand-oldal elérhető a jelenlegi szolgáltatási
          #    útvonalon.
          sites=(
            imperial
            danish-fabrik
            bautica
            prefab
            casa-moderna
            family-homes
            everyday-homes
            property-360
            budapesti-magasepito-vallalat
            baufreund
            red-property
            timberhaus
          )

          for site in "${sites[@]}"; do
            site_html="$(curl --fail --silent --show-error \
              --header "Host: localhost" \
              "http://127.0.0.1:8080/site-preview/${site}/")"
            grep --quiet 'name="robots" content="noindex,nofollow"' <<<"$site_html"
          done

          preview_html="$(curl --fail --silent --show-error \
            --header "Host: localhost" \
            'http://127.0.0.1:8080/site-preview/imperial/?review=1')"
          for section_id in hero trust portfolio capabilities projects sustainability news contact; do
            grep --quiet "id=\"${section_id}\"" <<<"$preview_html"
          done

          drive_previews=(
            "site-preview/imperial/drive/venture/venture-studio.html?review=1"
            "site-preview/bautica/drive/b2b-belsoepiteszet-kivitelezes.html?review=1"
            "site-preview/prefab/drive/knowledge/osszes-tudasoldal.html?review=1"
            "site-preview/budapesti-magasepito-vallalat/drive/index.html?review=1"
          )

          for preview in "${drive_previews[@]}"; do
            drive_preview_html="$(curl --fail --silent --show-error \
              --header "Host: localhost" \
              "http://127.0.0.1:8080/${preview}")"
            grep --quiet '/assets/review-bridge.js' <<<"$drive_preview_html"
          done

          imperial_data_json="$(curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/assets/data/imperial-home.json)"
          python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["meta"]["containsCustomerData"] is False' <<<"$imperial_data_json"

          health_response="$(curl --fail --silent --show-error \
            http://127.0.0.1:8080/healthz)"
          grep --quiet "^ok$" <<<"$health_response"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop staging stack
        if: always()
        run: docker compose down --volumes --remove-orphans
