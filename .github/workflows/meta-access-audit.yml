name: Meta access audit (redacted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: imperial-test
    env:
      META_ADS_ACCESS_TOKEN: ${{ secrets.META_ADS_ACCESS_TOKEN }}
      META_ADS_AD_ACCOUNT_ID: ${{ vars.META_ADS_AD_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit Meta access without exposing identifiers
        run: node scripts/meta-access-audit.mjs
