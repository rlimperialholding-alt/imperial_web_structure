name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/operational-guidance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/operational-guidance/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m compileall app scripts
      - run: python scripts/validate_integrated_repository.py
      - run: ruff check app tests scripts
      - run: pytest -q

  itep-core:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://itep:itep@127.0.0.1:5432/itep?schema=public
    defaults:
      run:
        working-directory: services/itep-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/itep-core/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm test

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate integrated Compose model
        env:
          CRM_API_BASE_URL: https://crm.invalid
          CRM_ACCESS_TOKEN: validation-only-token
          CRM_WORKSPACE_ID: validation-workspace
          ITEP_IDENTITY_SHARED_SECRET: validation-only-shared-secret-00000000
        run: docker compose -f docker-compose.github-test.yml config --quiet
