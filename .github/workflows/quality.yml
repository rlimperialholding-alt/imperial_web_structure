name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/operational-guidance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/operational-guidance/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m compileall app scripts
      - run: python scripts/validate_integrated_repository.py
      - run: ruff check app tests scripts
      - run: pytest -q

  itep-core:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://itep:itep@127.0.0.1:5432/itep?schema=public
    defaults:
      run:
        working-directory: services/itep-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/itep-core/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-package-age.mjs
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  imperial-sales-crm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/imperial-sales-crm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/imperial-sales-crm/package-lock.json
      - run: npm run install:ci
      - run: node scripts/check-package-age.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate integrated Compose model
        env:
          CRM_MIGRATION_TOKEN: validation-only-migration-token-000000000000
          ITEP_CRM_READ_TOKEN: validation-only-read-token-0000000000000000
          ITEP_IDENTITY_SHARED_SECRET: validation-only-shared-secret-00000000
        run: docker compose -f docker-compose.github-test.yml config --quiet
