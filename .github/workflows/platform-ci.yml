name: Imperial Intelligence CI

on:
  push:
    branches:
      - main
      - staging
      - "feature/**"
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: intelligence-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Validate module routes, fixtures and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: intelligence-ci-${{ github.run_id }}
      HTTP_PORT: "8080"
      NGINX_IMAGE: nginx:stable-alpine

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate platform model and cross-module links
        run: python3 scripts/validate-platform.py

      - name: Validate client syntax
        run: node --check sites/_shared/assets/platform.js

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start isolated staging stack
        run: docker compose up --detach --wait --wait-timeout 60

      - name: Smoke test every module route
        shell: bash
        run: |
          set -euo pipefail

          routes=(
            executive-dashboard
            my-imperial
            crm
            sales
            contract-generator
            project-control
            financial-control
            imperial-care
            partner-control
            marketing-control
            website-content-control
            document-center
            workflow-center
            admin
          )

          for route in "${routes[@]}"; do
            module_html="$(curl --fail --silent --show-error \
              --header "Host: localhost" \
              "http://127.0.0.1:8080/${route}/")"
            grep --quiet '/assets/platform.css' <<<"$module_html"
            grep --quiet '/assets/platform.js' <<<"$module_html"
          done

          curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/data/platform.json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["modules"]) == 14; assert len(d["leads"]) >= 10; assert len(d["customers"]) >= 5; assert len(d["projects"]) >= 3; assert len(d["partners"]) >= 5; assert len(d["offers"]) >= 8; assert len(d["contracts"]) >= 4; assert len(d["financialItems"]) >= 20; assert len(d["careTickets"]) >= 6; assert d["meta"]["synthetic"] is True; assert d["meta"]["containsCustomerData"] is False'

          curl --fail --silent --show-error \
            --header "Host: localhost" \
            http://127.0.0.1:8080/assets/platform.js \
            | grep --quiet 'history.pushState'

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/healthz \
            | grep --quiet "^ok$"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop isolated staging stack
        if: always()
        run: docker compose down --volumes --remove-orphans
