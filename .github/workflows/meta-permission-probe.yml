name: Meta permission read-only probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: imperial-test
    steps:
      - name: Inspect token type and granted permissions without writing
        shell: bash
        env:
          META_ADS_ACCESS_TOKEN: ${{ secrets.META_ADS_ACCESS_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.META_ADS_ACCESS_TOKEN;
          if (!token) throw new Error('META_ADS_ACCESS_TOKEN_NOT_CONFIGURED');
          const base = 'https://graph.facebook.com/v25.0';
          const read = async (path) => {
            const join = path.includes('?') ? '&' : '?';
            const response = await fetch(`${base}${path}${join}access_token=${encodeURIComponent(token)}`);
            const payload = await response.json();
            return { ok: response.ok, status: response.status, payload };
          };
          const [permissions, identity, debug, account, systemUser, businessSystemUsers, assignedAdAccounts] = await Promise.all([
            read('/me/permissions'),
            read('/me?fields=id,name'),
            read(`/debug_token?input_token=${encodeURIComponent(token)}`),
            read('/act_286070571789380?fields=id,name,account_status'),
            read('/122108445387408916?fields=id,name,role'),
            read('/268626736867097/system_users?fields=id,name,role'),
            read('/122108445387408916/assigned_ad_accounts?fields=id,name,tasks')
          ]);
          const result = {
            permissions: permissions.payload?.data || permissions.payload?.error || null,
            identity: identity.ok ? identity.payload : identity.payload?.error || null,
            debug: debug.ok ? {
              app_id: debug.payload?.data?.app_id || null,
              type: debug.payload?.data?.type || null,
              user_id: debug.payload?.data?.user_id || null,
              is_valid: debug.payload?.data?.is_valid || false,
              scopes: debug.payload?.data?.scopes || [],
              granular_scopes: debug.payload?.data?.granular_scopes || []
            } : debug.payload?.error || null,
            account: account.ok ? account.payload : account.payload?.error || null,
            system_user: systemUser.ok ? systemUser.payload : systemUser.payload?.error || null,
            business_system_users: businessSystemUsers.ok ? businessSystemUsers.payload : businessSystemUsers.payload?.error || null,
            assigned_ad_accounts: assignedAdAccounts.ok ? assignedAdAccounts.payload : assignedAdAccounts.payload?.error || null
          };
          console.log(JSON.stringify(result));
          NODE
