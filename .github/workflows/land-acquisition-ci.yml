name: Land acquisition safety CI

on:
  push:
    branches:
      - agent/imperial-land-automation-v1
  pull_request:
    branches:
      - agent/canonical-growth-25494-deepseek-v1
    paths:
      - "config/land-acquisition/**"
      - "services/platform-core/app/land_acquisition/**"
      - "services/platform-core/app/growth_ops/**"
      - "services/platform-core/alembic/versions/**"
      - "services/platform-core/tests/test_land_acquisition.py"
      - ".github/workflows/land-acquisition-ci.yml"

permissions:
  contents: read

concurrency:
  group: land-acquisition-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/platform-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/platform-core/requirements.txt
            services/platform-core/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint changed safety surface
        run: >-
          ruff check app/land_acquisition app/growth_ops/catalog.py
          app/growth_ops/processing.py app/growth_ops/service.py
          tests/test_land_acquisition.py
          alembic/versions/20260825_0077_land_acquisition.py
          alembic/versions/20260825_0078_land_recipient_roles.py
          alembic/versions/20260825_0079_growth_outreach_html.py
          alembic/versions/20260825_0080_land_agent_affiliation_gate.py
      - name: Run land and Growth Ops regression tests
        run: >-
          pytest -q tests/test_land_acquisition.py tests/test_growth_ops.py
          tests/test_canonical_growth_wide.py tests/test_growth_catalog.py
          tests/test_growth_processing_pipeline.py
      - name: Prove full migration chain
        env:
          DATABASE_URL: sqlite:////tmp/imperial-land-migration-ci.sqlite
        run: |
          alembic upgrade head
          test "$(alembic current 2>/dev/null | head -1)" = "20260825_0080 (head)"
