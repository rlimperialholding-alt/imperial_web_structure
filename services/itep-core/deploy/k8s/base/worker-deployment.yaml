apiVersion: apps/v1
kind: Deployment
metadata:
  name: imperial-itep-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imperial-itep-worker
  template:
    metadata:
      labels:
        app: imperial-itep-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/imperial-holding/itep-core:1.1.0
          command: ["node", "dist/src/workers/main.js"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: imperial-itep-secrets
            - configMapRef:
                name: imperial-itep-config
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
