apiVersion: v1
kind: Secret
metadata:
  name: imperial-itep-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/itep?schema=public"
  DEFAULT_CONTACT_EMAIL: "office@example.com"
  IDENTITY_SHARED_SECRET: "replace-with-32-plus-character-secret"
  CONNECTOR_ACCESS_TOKEN_BILLINGO_LIVE: "replace-with-billingo-api-key"
  CONNECTOR_ACCESS_TOKEN_META_ADS_LIVE: "replace-with-meta-read-token"
  CONNECTOR_ACCESS_TOKEN_GOOGLE_ADS_LIVE: '{"developerToken":"replace","clientId":"replace","clientSecret":"replace","refreshToken":"replace","loginCustomerId":"optional"}'
