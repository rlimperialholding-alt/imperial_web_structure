services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: itep
      POSTGRES_PASSWORD: itep-local
      POSTGRES_DB: itep
    ports:
      - "5432:5432"
    volumes:
      - itep_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itep"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  itep_postgres:

  worker:
    build: .
    command: ["node", "dist/src/workers/main.js"]
    environment:
      DATABASE_URL: "postgresql://itep:itep-local@postgres:5432/itep?schema=public"
      ENFORCEMENT_INTERVAL_MS: "60000"
      OUTBOX_INTERVAL_MS: "15000"
    depends_on:
      postgres:
        condition: service_healthy
