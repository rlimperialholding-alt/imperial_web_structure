<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlanCheck feltöltés</title><style>body{font:16px system-ui;background:#f3f1eb;color:#17202a;margin:0}.wrap{max-width:720px;margin:5vh auto;background:white;padding:32px;border-radius:16px;box-shadow:0 12px 40px #0002}label{display:block;margin:18px 0}select,input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px}button{background:#9b7a2f;color:white;border:0;font-weight:700}.ok{padding:14px;background:#e6f5e9;color:#145a2c}</style></head><body><main class="wrap"><p>IMPERIAL INTELLIGENCE · PLANCHECK v0.1</p><h1>{{ case.title }}</h1><p>Ügyazonosító: {{ case.case_id }} · ProjectID: {{ case.project_id }}</p>{% if uploaded %}<p class="ok">A fájl SHA-256 ellenőrzéssel új revízióba került. További dokumentumot is feltölthetsz.</p>{% endif %}<form method="post" enctype="multipart/form-data"><label>Dokumentumtípus<select name="category"><option value="site_plan">helyszínrajz</option><option value="floor_plan">alaprajz</option><option value="elevations">homlokzatok</option><option value="sections">metszetek</option><option value="technical_description">műszaki leírás</option><option value="other">egyéb</option></select></label><label>Fájl (PDF/JPG/PNG/DOCX/XLSX/IFC/DWG, legfeljebb 20 MB)<input type="file" name="document" required accept=".pdf,.jpg,.jpeg,.png,.docx,.xlsx,.ifc,.dwg"></label><button>Biztonságos feltöltés</button></form></main></body></html>
