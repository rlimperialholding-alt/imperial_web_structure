[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imperial-contract-generator"
version = "0.4.0"
description = "Immutable-master contract package generator and control gates for Imperial Intelligence"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1,<2"]

[project.scripts]
imperial-contract = "imperial_contract_generator.core:cli"

[tool.setuptools]
packages = ["imperial_contract_generator"]
