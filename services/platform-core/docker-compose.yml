services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: imperial_control_center
      POSTGRES_USER: imperial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imperial -d imperial_control_center"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - control_center_db:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://imperial:${POSTGRES_PASSWORD}@db:5432/imperial_control_center
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required}
      CONTROL_CENTER_API_TOKEN: ${CONTROL_CENTER_API_TOKEN:?CONTROL_CENTER_API_TOKEN required}
      INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN:?INTERNAL_JOB_TOKEN required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "8000:8000"
  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://imperial:${POSTGRES_PASSWORD}@db:5432/imperial_control_center
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required}
      CONTROL_CENTER_API_TOKEN: ${CONTROL_CENTER_API_TOKEN:?CONTROL_CENTER_API_TOKEN required}
      INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN:?INTERNAL_JOB_TOKEN required}
    command: ["python", "-m", "app.worker"]
volumes:
  control_center_db:
